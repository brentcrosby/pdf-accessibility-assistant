name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn --batch-mode verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review-state tests
        run: node --test src/test/js/*.test.mjs
